<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MakerShape</title>
<meta name="theme-color" content="#13315C">
<link rel="icon" type="image/png" href="assets/icon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <img class="logo" src="assets/logo-header.png" alt="MakerShape">
  <input id="doc-name" value="Untitled design" spellcheck="false" title="Design name">
  <div class="tb">
    <button class="f" id="btn-new" title="New design"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg><span>New</span></button>
    <button class="f" id="btn-open" title="Open a .makershape file (⌘O)"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg><span>Open</span></button>
    <button class="f" id="btn-save" title="Save design (⌘S)"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg><span>Save</span></button>
    <i class="sep"></i>
    <button class="f" id="btn-import" title="Import STL, 3MF or STEP (or drop a file on the workplane)"><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 14v6h16v-6"/></svg><span>Import</span></button>
    <button class="f" id="btn-tracer" title="Trace a photo into a shape, or lay a reference photo on the workplane"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8.5 15.5c1-3 2.5-4.5 3.5-4.5s1.5 1.5 3.5 1.5"/><circle cx="9.5" cy="9" r="1.3"/></svg><span>Trace photo</span></button>
    <button id="btn-sketch" title="Sketch on the workplane or a flat face (K)"><svg viewBox="0 0 24 24"><path d="M4 20h7"/><path d="M15.5 4.5a2.1 2.1 0 0 1 3 3L9 17l-4 1 1-4z"/></svg><span>Sketch</span></button>
    <i class="sep"></i>
    <button id="btn-undo" title="Undo (⌘Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button id="btn-redo" title="Redo (⇧⌘Z)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <i class="sep"></i>
    <button id="btn-dup" title="Duplicate (⌘D)"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg></button>
    <button id="btn-del" title="Delete (⌫)"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    <i class="sep"></i>
    <button id="btn-rotate" title="Rotate (R)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg><span>Rotate</span></button>
    <button id="btn-align" title="Align shapes (L)"><svg viewBox="0 0 24 24"><path d="M4 3v18"/><rect x="7" y="5" width="10" height="5" rx="1"/><rect x="7" y="14" width="14" height="5" rx="1"/></svg><span>Align</span></button>
    <i class="sep"></i>
    <button id="btn-pp" title="Push/Pull a face (U)"><svg viewBox="0 0 24 24"><rect x="4" y="12" width="16" height="8" rx="1"/><path d="M12 10V3M9 6l3-3 3 3"/></svg><span>Push/Pull</span></button>
    <button id="btn-edges" title="Round / chamfer edges (E)"><svg viewBox="0 0 24 24"><path d="M4 20V11a7 7 0 0 1 7-7h9"/></svg><span>Edges</span></button>
    <i class="sep"></i>
    <button id="btn-hole" title="Solid ↔ Hole (H)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="3 2.5"/></svg><span>Hole</span></button>
    <button id="btn-group" title="Group (⌘G)"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="10" height="10" rx="1"/><circle cx="15" cy="12" r="6"/></svg><span>Group</span></button>
    <button id="btn-ungroup" title="Ungroup (⇧⌘G)"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="9" height="9" rx="1"/><circle cx="17" cy="12" r="5"/></svg><span>Ungroup</span></button>
    <i class="sep"></i>
    <button id="btn-paint" title="Paint: bucket fill and brush (P)"><svg viewBox="0 0 24 24"><path d="M18.5 3.5a2.1 2.1 0 0 1 3 3L12 16l-4-4z"/><path d="M8 12c-3 0-4 2-4 4 0 1.5-1 2.5-2 3 3 1 7 0 8-3"/></svg><span>Paint</span></button>
  </div>
  <div id="export-wrap">
    <button id="btn-export" class="export" title="Export for 3D printing"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg>Export<span class="caret">▾</span></button>
    <div id="export-menu">
      <button data-fmt="bambu"><b>3MF · Bambu Studio</b><span>Multi-colour project for your A1 — colours become filaments</span></button>
      <button data-fmt="stl"><b>STL</b><span>Single colour · works with every slicer</span></button>
      <button data-fmt="3mf"><b>3MF · other slicers</b><span>Multi-colour · Prusa, Orca, Cura and others</span></button>
      <button data-fmt="obj"><b>OBJ</b><span>Multi-colour · for other 3D apps (zip with colour file)</span></button>
      <p>Exports the selected shapes, or everything if nothing is selected. Holes on their own are left out.</p>
    </div>
  </div>
  <input id="file-open" type="file" accept=".makershape,.json,application/json,.stl,.3mf,.step,.stp" hidden>
  <input id="file-import" type="file" accept=".stl,.3mf,.step,.stp" multiple hidden>
  <input id="file-tracer" type="file" accept="image/*" hidden>
</header>

<aside id="palette">
  <h2>Shapes</h2>
  <div id="shapes"></div>
  <p class="pal-tip">Click a shape, then click the workplane (or another shape) to drop it.</p>
  <h2>Gridfinity</h2>
  <div id="gf-shapes"></div>
  <h2>SKÅDIS &amp; pegboards</h2>
  <div id="skadis-shapes"></div>
  <h2>Generators</h2>
  <div id="gen-shapes"></div>
  <h2>Fasteners</h2>
  <div id="fast-shapes"></div>
  <div class="lib-head"><h2>User Shapes</h2><span><button id="lib-import" title="Import a User Shapes library file">Import</button><button id="lib-export" title="Save all your User Shapes to one file">Export</button></span></div>
  <div id="user-shapes"></div>
  <input id="lib-file" type="file" accept=".makershape-library,.json,application/json" hidden>
</aside>

<main id="viewport">
  <div id="viewbar">
    <button id="v-home" title="Home view"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg></button>
    <button id="v-fit" title="Zoom to selection (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
    <button id="v-in" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="v-out" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <i></i>
    <button id="v-top" class="txt" title="Top view">Top</button>
    <button id="v-front" class="txt" title="Front view">Front</button>
    <button id="v-right" class="txt" title="Right view">Right</button>
  </div>
  <div id="toast"></div>
  <div id="marquee"></div>
  <div id="rot-label"></div>
  <div id="paint-pane"></div>
  <div id="busy"><div class="spin"></div><span id="busy-msg">Working…</span></div>
</main>

<aside id="inspector"></aside>

<footer id="status">
  <span id="hint"></span>
  <span class="grow"></span>
  <span id="obj-count"></span>
  <button id="btn-bed" title="Your printer's bed size — used to split drawer grids, SKÅDIS boards and other big prints into pieces that fit"></button>
  <span id="param-wrap">
    <button id="btn-param" title="Parametric design on/off — saved with this design" aria-pressed="false"><i class="knob"></i><span>Parametric</span></button>
    <button id="btn-vars" hidden title="Variables for formulas"><b>ƒx</b><span>Variables</span></button>
  </span>
  <label>Snap Grid <select id="snap" title="Snap Grid — also the arrow-key nudge step"><option value="0">Off</option><option value="0.1">0.1 mm</option><option value="0.25">0.25 mm</option><option value="0.5">0.5 mm</option><option value="1" selected>1.0 mm</option><option value="2">2.0 mm</option><option value="5">5.0 mm</option><option value="10">10 mm</option><option value="21">21 mm (½ Gridfinity)</option><option value="42">42 mm (Gridfinity)</option></select></label>
  <span class="units">mm</span>
</footer>

<div id="fontpop"></div>
<div id="varpop"></div>
<div id="user-menu"></div>
<div id="modal"></div>

<div id="splash">
  <img src="assets/logo-full.png" alt="MakerShape">
  <div class="bar"><i></i></div>
  <p id="splash-status">Loading…</p>
</div>

<script src="lib/occ-engine.js"></script>
<script src="lib/font.js"></script>
<script src="lib/mesh-engine.js"></script>
<script src="lib/cad-worker.js"></script>
<script src="app.js"></script>
</body>
</html>
